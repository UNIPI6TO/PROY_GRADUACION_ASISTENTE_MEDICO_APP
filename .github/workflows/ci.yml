name: CI (Quality Gate & Tests)

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  backend-quality-gate:
    name: Backend Quality Gate (Pytest & Evaluador RAG/Flujo)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Tests (Pytest)
        run: pytest -q

      - name: Run Plan de Calidad Evaluator (eval/evaluar.py)
        run: python eval/evaluar.py

  frontend-quality-gate:
    name: Frontend Quality Gate (Vitest & Secret Audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Verify No Secrets in Frontend Bundle
        working-directory: ./frontend
        run: npm run verify:secrets

      - name: Run Frontend Tests (Vitest)
        working-directory: ./frontend
        run: npm test
