name: Integración Continua (Compuertas de Calidad y Pruebas)

on:
  pull_request:
    branches:
      - main
      - develop
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

jobs:
  secret-scan:
    name: Auditoría de Secretos (Gitleaks)
    uses: ./.github/workflows/secretos.yml
    secrets: inherit

  backend-quality-gate:
    name: Compuerta de Calidad del Backend (Pytest y Evaluador RAG/Flujo)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Descargar código fuente del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias del Backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pruebas unitarias del Backend (Pytest)
        run: pytest -q

      - name: Ejecutar evaluador del Plan de Calidad (eval/evaluar.py)
        run: python eval/evaluar.py

  frontend-quality-gate:
    name: Compuerta de Calidad del Frontend (Vitest y Auditoría de Secretos)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Descargar código fuente del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del Frontend
        working-directory: ./frontend
        run: npm ci

      - name: Verificar ausencia de secretos en el bundle web
        working-directory: ./frontend
        run: npm run verify:secrets

      - name: Ejecutar pruebas unitarias del Frontend (Vitest)
        working-directory: ./frontend
        run: npm test
