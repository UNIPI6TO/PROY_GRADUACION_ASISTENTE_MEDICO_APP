name: Release & Tag Frontend (Post-Merge)

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'frontend/**'

jobs:
  tag-and-changelog:
    name: Tag Frontend Release and Update Changelog
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.BUMP_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract Current Frontend Version
        id: meta
        run: |
          VERSION="$(python -c "import json, pathlib; data = json.loads(pathlib.Path('frontend/package.json').read_text(encoding='utf-8')); print(data.get('version', ''))")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=frontend-v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create Git Tag and Update CHANGELOG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          TAG="${{ steps.meta.outputs.tag }}"
          BRANCH="${{ github.ref_name }}"
          
          # 1. Crear y publicar tag en Git si no existe
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            TIPO="release"
            if [ "$BRANCH" = "develop" ]; then
              TIPO="snapshot"
            fi
            git tag -a "$TAG" -m "Automated frontend $TIPO tag: $TAG [skip ci]"
            git push origin "$TAG"
            echo "Tag $TAG publicado con éxito."
          else
            echo "El tag $TAG ya existe en Git."
          fi
          
          # 2. Actualizar CHANGELOG.md tras el tageo
          if [ -n "$TAG" ]; then
            python scripts/actualizar_changelog.py --version "$TAG"
            
            if ! git diff --quiet CHANGELOG.md; then
              git add CHANGELOG.md
              git commit -m "docs(changelog): registrar frontend en $BRANCH ($TAG) [skip ci]"
              git push origin HEAD:$BRANCH
            fi
          fi
