name: Publicación y Tageo de Versiones (Post-Merge)

on:
  pull_request:
    branches:
      - main
      - develop
    types:
      - closed
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Rama objetivo para el release'
        required: false
        default: 'develop'
        type: choice
        options:
          - develop
          - main

jobs:
  release-and-tag:
    name: Versionado SemVer, Bitácoras y Publicación de Git Tag
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Resolver rama de destino
        id: branch_info
        run: |
          RESOLVED_BRANCH="${{ inputs.target_branch || github.base_ref || github.ref_name }}"
          echo "target_branch=${RESOLVED_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "Rama objetivo para release: ${RESOLVED_BRANCH}"

      - name: Descargar código fuente de la rama de destino
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.branch_info.outputs.target_branch }}
          fetch-depth: 0
          token: ${{ secrets.BUMP_TOKEN }}

      - name: Configurar entorno Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 1. Bump SemVer simétrico (Backend, Frontend y README.md)
      - name: Calcular e incrementar versión simétrica (SemVer)
        id: bumper
        run: |
          TARGET_BRANCH="${{ steps.branch_info.outputs.target_branch }}"
          python scripts/semver_bumper.py --branch "$TARGET_BRANCH"

      # 2. Actualizar Changelogs y commit atómico de release
      - name: Actualizar bitácoras de cambios y registrar versión en Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.BUMP_TOKEN }}@github.com/${{ github.repository }}.git

          BRANCH="${{ steps.branch_info.outputs.target_branch }}"
          VER="${{ steps.bumper.outputs.version }}"
          TAG="${{ steps.bumper.outputs.tag }}"

          # Actualizar changelogs
          if [ -n "$VER" ] && [ -f "app/CHANGELOG.md" ]; then
            python scripts/actualizar_changelog.py --version "$VER" --file app/CHANGELOG.md || true
          fi
          if [ -n "$VER" ] && [ -f "frontend/CHANGELOG.md" ]; then
            python scripts/actualizar_changelog.py --version "$VER" --file frontend/CHANGELOG.md || true
          fi

          # Commit consolidado de versión y documentación
          if ! git diff --quiet; then
            git add app/main.py frontend/package.json frontend/package-lock.json README.md app/CHANGELOG.md frontend/CHANGELOG.md || true
            git commit -m "chore(release): bump symmetric version to $TAG [skip ci]" || true
            git push origin HEAD:$BRANCH || echo "Advertencia: no se pudo hacer push de la versión en $BRANCH"
          fi

      # 3. Publicar Git Tag formal apuntando al commit de release
      - name: Crear y publicar Git Tag formal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.BUMP_TOKEN }}@github.com/${{ github.repository }}.git

          TAG="${{ steps.bumper.outputs.tag }}"
          BRANCH="${{ steps.branch_info.outputs.target_branch }}"

          if [ -n "$TAG" ] && [ "$TAG" != "v" ]; then
            if ! git rev-parse "$TAG" >/dev/null 2>&1; then
              TIPO="release"
              if [ "$BRANCH" = "develop" ]; then
                TIPO="snapshot"
              fi
              git tag -a "$TAG" -m "Automated $TIPO tag: $TAG [skip ci]"
              git push origin "$TAG" || echo "Advertencia: no se pudo empujar el tag $TAG"
              echo "Tag $TAG publicado con éxito."
            else
              echo "El tag $TAG ya existe en Git."
            fi
          fi
