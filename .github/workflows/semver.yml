name: SemVer (PR Bump)

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'app/**'
      - 'frontend/**'
      - '!app/CHANGELOG.md'
      - '!frontend/CHANGELOG.md'
      - '!CHANGELOG.md'
    types:
      - opened
      - synchronize
      - reopened

jobs:
  bump-version:
    name: Bump Symmetric Version on Compare Branch
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code Repository (Compare Branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.BUMP_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Execute Symmetric SemVer Bumper
        id: bumper
        run: python scripts/semver_bumper.py --branch "${{ github.base_ref }}"

      - name: Commit Symmetric Version Bump to Compare Branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.BUMP_TOKEN }}@github.com/${{ github.repository }}.git
          
          # El bump actualiza simétricamente app/main.py y frontend/package.json en la rama compare (head_ref)
          if ! git diff --quiet app/main.py frontend/package.json; then
            git add app/main.py frontend/package.json frontend/package-lock.json
            git commit -m "chore(release): bump symmetric version to ${{ steps.bumper.outputs.version }} [skip ci]"
            git push origin HEAD:${{ github.head_ref }}
          fi
