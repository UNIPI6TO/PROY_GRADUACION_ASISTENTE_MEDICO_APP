name: SemVer (PR Bump)

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'app/**'
      - 'frontend/**'
      - '!app/CHANGELOG.md'
      - '!frontend/CHANGELOG.md'
      - '!CHANGELOG.md'
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Rama compare a incrementar (dejar en blanco para usar la rama actual)'
        required: false
        default: ''
        type: string
      base_branch:
        description: 'Rama base de comparación para el bump'
        required: false
        default: 'develop'
        type: choice
        options:
          - develop
          - main

jobs:
  bump-version:
    name: Bump Symmetric Version on Compare Branch
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Resolve Branch Context
        id: context
        run: |
          # 1. Rama compare (la rama que recibe el incremento de versión)
          COMPARE_BRANCH="${{ inputs.target_branch || github.head_ref || github.ref_name }}"
          # 2. Rama base (contra la cual se comparan los commits para SemVer)
          BASE_BRANCH="${{ inputs.base_branch || github.base_ref || 'develop' }}"
          
          echo "compare_branch=${COMPARE_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "base_branch=${BASE_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "Rama compare objetivo: ${COMPARE_BRANCH}"
          echo "Rama base de comparación: ${BASE_BRANCH}"

      - name: Checkout Code Repository (Compare Branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.context.outputs.compare_branch }}
          fetch-depth: 0
          token: ${{ secrets.BUMP_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Execute Symmetric SemVer Bumper
        id: bumper
        run: python scripts/semver_bumper.py --branch "${{ steps.context.outputs.base_branch }}"

      - name: Commit Symmetric Version Bump to Compare Branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.BUMP_TOKEN }}@github.com/${{ github.repository }}.git
          
          TARGET_REF="${{ steps.context.outputs.compare_branch }}"
          # El bump actualiza simétricamente app/main.py y frontend/package.json en la rama compare
          if ! git diff --quiet app/main.py frontend/package.json; then
            git add app/main.py frontend/package.json frontend/package-lock.json
            git commit -m "chore(release): bump symmetric version to ${{ steps.bumper.outputs.version }} [skip ci]"
            git push origin HEAD:${TARGET_REF}
          fi
