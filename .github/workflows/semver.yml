name: SemVer Backend (PR Bump)

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'app/**'
      - '!app/CHANGELOG.md'
      - '!frontend/CHANGELOG.md'
      - '!CHANGELOG.md'
    types:
      - opened
      - synchronize
      - reopened

jobs:
  bump-version:
    name: Bump Backend Version on Compare Branch
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code Repository (Compare Branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.BUMP_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite Pre-Check
        run: pytest -q

      - name: Execute SemVer Bumper
        id: bumper
        run: python scripts/semver_bumper.py --branch "${{ github.base_ref }}"

      - name: Commit Version Bump to Compare Branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # El bump actualiza exclusivamente la rama compare (head_ref), nunca la base branch
          if ! git diff --quiet app/main.py; then
            git add app/main.py
            git commit -m "chore(release): bump backend version to ${{ steps.bumper.outputs.version }} [skip ci]"
            git push origin HEAD:${{ github.head_ref }}
          fi
