name: Deploy to GCP Cloud Run

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Tag/Versión del release para etiquetar en Artifact Registry (dejar vacío para detectar automáticamente desde Git tag / app/main.py)'
        required: false
        default: ''
        type: string

env:
  GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY || 'guiavital-repo' }}
  BACKEND_SERVICE: guiavital-backend
  FRONTEND_SERVICE: guiavital
  BACKEND_SA_NAME: ${{ vars.BACKEND_SA_NAME || 'guiavital-backend-sa' }}

jobs:
  test:
    name: Pre-Build Quality Gate (Backend & Frontend Tests)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies & Run Pytest
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest -q

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies & Run Vitest + Secret Check
        working-directory: ./frontend
        run: |
          npm ci
          npm run verify:secrets
          npm test

  deploy:
    name: Build, Tag & Deploy to Cloud Run
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Release / Version Metadata
        id: meta
        run: |
          INPUT_TAG="${{ inputs.version_tag }}"
          if [ -n "$INPUT_TAG" ]; then
            RAW_TAG="$INPUT_TAG"
          elif git describe --tags --abbrev=0 >/dev/null 2>&1; then
            RAW_TAG="$(git describe --tags --abbrev=0)"
          else
            APP_VER="$(python3 -c "import re, pathlib; m = re.search(r'APP_VERSION\s*=\s*\"([^\"]+)\"', pathlib.Path('app/main.py').read_text(encoding='utf-8')); print(m.group(1) if m else '0.1.0')")"
            RAW_TAG="v${APP_VER#v}"
          fi

          SEMVER_CLEAN="${RAW_TAG#v}"
          IMAGE_TAG="v${SEMVER_CLEAN}"
          SHORT_SHA="${GITHUB_SHA::7}"

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "app_version=${SEMVER_CLEAN}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud via Deployer SA (GCP_JSON_KEY)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_JSON_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify Infrastructure & Secret Manager Pre-requisites (SRE Gate)
        id: infra_check
        env:
          PROJECT_ID: ${{ steps.auth.outputs.project_id }}
        run: |
          RUNTIME_SA_EMAIL="${{ env.BACKEND_SA_NAME }}@${PROJECT_ID}.iam.gserviceaccount.com"

          # 1. Verificar que la Service Account exclusiva del backend exista
          if ! gcloud iam service-accounts describe "${RUNTIME_SA_EMAIL}" --project="${PROJECT_ID}" >/dev/null 2>&1; then
            echo "::error::No existe la Service Account '${RUNTIME_SA_EMAIL}'. Ejecute primero el workflow 'Provision GCP Infrastructure (SRE)'."
            exit 1
          fi

          # 2. Verificar que los secretos existan y tengan una versión habilitada cargada manualmente en GCP Console
          for SECRET_NAME in GEMINI_API_KEY GROQ_API_KEY; do
            ENABLED_VER="$(gcloud secrets versions list "${SECRET_NAME}" --project="${PROJECT_ID}" --filter="state=ENABLED" --limit=1 --format="value(name)" 2>/dev/null || true)"
            if [ -z "${ENABLED_VER}" ]; then
              echo "::error::El secreto '${SECRET_NAME}' no tiene ninguna versión activa (ENABLED) en Secret Manager. Ingrese el valor manualmente desde la consola de GCP."
              exit 1
            fi
          done

          echo "runtime_sa_email=${RUNTIME_SA_EMAIL}" >> "$GITHUB_OUTPUT"

      - name: Configure Docker for GCP Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build & Push Backend Container (guiavital-backend)
        env:
          IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ steps.auth.outputs.project_id }}/${{ env.GAR_REPOSITORY }}/${{ env.BACKEND_SERVICE }}
        run: |
          docker build \
            -f app/Dockerfile \
            -t "${IMAGE_URI}:${{ steps.meta.outputs.image_tag }}" \
            -t "${IMAGE_URI}:${{ steps.meta.outputs.sha_tag }}" \
            .
          docker push "${IMAGE_URI}:${{ steps.meta.outputs.image_tag }}"
          docker push "${IMAGE_URI}:${{ steps.meta.outputs.sha_tag }}"

      - name: Deploy Backend to Cloud Run with Dedicated Runtime SA & Secret Manager
        id: deploy_backend
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.BACKEND_SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ steps.auth.outputs.project_id }}/${{ env.GAR_REPOSITORY }}/${{ env.BACKEND_SERVICE }}:${{ steps.meta.outputs.image_tag }}
          service_account: ${{ steps.infra_check.outputs.runtime_sa_email }}
          env_vars: |
            APP_NAME=GuíaVital
            APP_VERSION=${{ steps.meta.outputs.app_version }}
            LLM_PROVIDER=${{ vars.LLM_PROVIDER || 'gemini' }}
            LLM_MODEL=${{ vars.LLM_MODEL || 'gemini-3.8-flash' }}
            LLM_FALLBACK_PROVIDER=${{ vars.LLM_FALLBACK_PROVIDER || 'groq' }}
            LLM_FALLBACK_MODEL=${{ vars.LLM_FALLBACK_MODEL || 'openai/gpt-oss-20b' }}
            LLM_TIMEOUT_SECONDS=${{ vars.LLM_TIMEOUT_SECONDS || '30' }}
            LLM_MAX_OUTPUT_TOKENS=${{ vars.LLM_MAX_OUTPUT_TOKENS || '2048' }}
            RATE_LIMIT_PER_MINUTE=${{ vars.RATE_LIMIT_PER_MINUTE || '10' }}
            HISTORIAL_DB=/tmp/historial.db
            CORS_ORIGINS=${{ vars.CORS_ORIGINS || 'http://localhost:5173' }}
          secrets: |
            GEMINI_API_KEY=GEMINI_API_KEY:latest
            GROQ_API_KEY=GROQ_API_KEY:latest
          flags: '--allow-unauthenticated --port=8080 --min-instances=0 --max-instances=5'

      - name: Build & Push Frontend Container (guiavital)
        env:
          IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ steps.auth.outputs.project_id }}/${{ env.GAR_REPOSITORY }}/${{ env.FRONTEND_SERVICE }}
        run: |
          docker build \
            -f frontend/Dockerfile \
            --build-arg VITE_API_URL="${{ steps.deploy_backend.outputs.url }}" \
            -t "${IMAGE_URI}:${{ steps.meta.outputs.image_tag }}" \
            -t "${IMAGE_URI}:${{ steps.meta.outputs.sha_tag }}" \
            ./frontend
          docker push "${IMAGE_URI}:${{ steps.meta.outputs.image_tag }}"
          docker push "${IMAGE_URI}:${{ steps.meta.outputs.sha_tag }}"

      - name: Deploy Frontend to Cloud Run (guiavital)
        id: deploy_frontend
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.FRONTEND_SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ steps.auth.outputs.project_id }}/${{ env.GAR_REPOSITORY }}/${{ env.FRONTEND_SERVICE }}:${{ steps.meta.outputs.image_tag }}
          env_vars: |
            APP_VERSION=${{ steps.meta.outputs.app_version }}
            VITE_API_URL=${{ steps.deploy_backend.outputs.url }}
          flags: '--allow-unauthenticated --port=8080 --min-instances=0 --max-instances=5'

      - name: Update Backend CORS_ORIGINS & Verify SRE Endpoints
        run: |
          gcloud run services update ${{ env.BACKEND_SERVICE }} \
            --region="${{ env.GCP_REGION }}" \
            --update-env-vars="CORS_ORIGINS=${{ steps.deploy_frontend.outputs.url }}"

          curl --fail --silent --show-error "${{ steps.deploy_backend.outputs.url }}/manage/health"
          curl --fail --silent --show-error "${{ steps.deploy_backend.outputs.url }}/manage/info"
          curl --fail --silent --show-error "${{ steps.deploy_frontend.outputs.url }}/healthz"
