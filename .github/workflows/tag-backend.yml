name: Release & Tag Backend (Post-Merge)

on:
  pull_request:
    branches:
      - main
      - develop
    types:
      - closed
    paths:
      - 'app/**'
      - '!app/CHANGELOG.md'
      - '!frontend/CHANGELOG.md'
      - '!CHANGELOG.md'

jobs:
  tag-and-changelog:
    name: Tag Release and Update Changelog on Merge
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Target Branch (Base Branch Post-Merge)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          fetch-depth: 0
          token: ${{ secrets.BUMP_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract Current Backend Version
        id: meta
        run: |
          VERSION="$(python -c "import re, pathlib; m = re.search(r'APP_VERSION\s*=\s*[\"|\']([^\"|\']+)[\"|\']', pathlib.Path('app/main.py').read_text(encoding='utf-8')); print(m.group(1) if m else '')")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create Git Tag and Update CHANGELOG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          TAG="${{ steps.meta.outputs.tag }}"
          VERSION="${{ steps.meta.outputs.version }}"
          BRANCH="${{ github.base_ref }}"
          
          # 1. Crear y publicar tag en Git si no existe
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            TIPO="release"
            if [ "$BRANCH" = "develop" ]; then
              TIPO="snapshot"
            fi
            git tag -a "$TAG" -m "Automated backend $TIPO tag: $TAG [skip ci]"
            git push origin "$TAG"
            echo "Tag $TAG publicado con éxito."
          else
            echo "El tag $TAG ya existe en Git."
          fi
          
          # 2. Actualizar app/CHANGELOG.md tras el tageo
          if [ -n "$VERSION" ]; then
            python scripts/actualizar_changelog.py --version "$VERSION" --file app/CHANGELOG.md
            
            if ! git diff --quiet app/CHANGELOG.md; then
              git add app/CHANGELOG.md
              git commit -m "docs(changelog): registrar backend en $BRANCH ($VERSION) [skip ci]"
              git push origin HEAD:$BRANCH
            fi
          fi
