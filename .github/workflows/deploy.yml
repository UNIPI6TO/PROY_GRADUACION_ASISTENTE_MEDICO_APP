name: Pipeline de Despliegue Continuo a GCP Cloud Run

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Tag formal de release generado por release.yml'
        required: false
        default: ''
        type: string
  workflow_run:
    workflows: ["Publicación y Tageo de Versiones (Post-Merge)"]
    types:
      - completed

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'project-3e1faa58-1e7d-4e8d-933' }}
  GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY || 'guiavital-repo' }}
  BACKEND_SERVICE: guiavital-backend
  FRONTEND_SERVICE: guiavital
  CANONICAL_BACKEND_URL: https://guiavital-backend-448060764458.us-central1.run.app
  CANONICAL_FRONTEND_URL: https://guiavital-448060764458.us-central1.run.app
  BACKEND_SA_EMAIL: ${{ vars.BACKEND_SA_EMAIL || 'guiavital-backend-sa@project-3e1faa58-1e7d-4e8d-933.iam.gserviceaccount.com' }}

jobs:
  # =========================================================================
  # FASE 1: Despliegue del Backend en Cloud Run (Consolidado Post-Tag)
  # =========================================================================
  deploy-backend:
    name: Construcción y Despliegue del Backend en Cloud Run
    # Solo se ejecuta post-merge: por workflow_run exitoso de release.yml o manual
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Descargar código fuente del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Búsqueda y consolidación de versión del Backend
        id: meta
        run: |
          # 1. Priorizar el tag entregado por release.yml
          INPUT_TAG="${{ inputs.version_tag }}"
          if [ -n "$INPUT_TAG" ]; then
            RAW_TAG="$INPUT_TAG"
          elif git describe --tags --abbrev=0 >/dev/null 2>&1; then
            RAW_TAG="$(git describe --tags --abbrev=0)"
          else
            APP_VER="$(python3 -c "import re, pathlib; m = re.search(r'APP_VERSION\s*=\s*[\"|\']([^\"|\']+)[\"|\']', pathlib.Path('app/main.py').read_text(encoding='utf-8')); print(m.group(1) if m else '0.1.0')")"
            RAW_TAG="v${APP_VER#v}"
          fi

          SEMVER_CLEAN="${RAW_TAG#v}"
          GCP_LABEL_VER="$(echo "${SEMVER_CLEAN}" | tr '[:upper:]' '[:lower:]' | tr '.' '-' | tr '+' '-')"
          IMAGE_TAG="v${SEMVER_CLEAN}"

          # Determinar puntero ambiental según rama
          BRANCH="${GITHUB_REF_NAME:-main}"
          ENV_TAG="latest"
          if [ "$BRANCH" = "develop" ]; then
            ENV_TAG="develop"
          fi

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "env_tag=${ENV_TAG}" >> "$GITHUB_OUTPUT"
          echo "app_version=${SEMVER_CLEAN}" >> "$GITHUB_OUTPUT"
          echo "gcp_label_version=${GCP_LABEL_VER}" >> "$GITHUB_OUTPUT"

      - name: Autenticar en Google Cloud con cuenta de servicio
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_JSON_KEY }}

      - name: Configurar Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configurar autenticación de Docker con Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      # Construcción consolidada: 1 sola imagen canónica + 1 puntero ambiental (sin atestaciones OCI)
      - name: Construir y publicar imagen consolidada del Backend
        env:
          BUILDX_NO_DEFAULT_ATTESTATIONS: 1
          IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ steps.auth.outputs.project_id || env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.BACKEND_SERVICE }}
        run: |
          docker build \
            --provenance=false \
            -f app/Dockerfile \
            --label "version=${{ steps.meta.outputs.app_version }}" \
            -t "${IMAGE_URI}:${{ steps.meta.outputs.image_tag }}" \
            -t "${IMAGE_URI}:${{ steps.meta.outputs.env_tag }}" \
            .
          docker push "${IMAGE_URI}:${{ steps.meta.outputs.image_tag }}"
          docker push "${IMAGE_URI}:${{ steps.meta.outputs.env_tag }}"

      - name: Desplegar servicio Backend en Google Cloud Run vinculando Secret Manager
        id: deploy_backend
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.BACKEND_SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ steps.auth.outputs.project_id || env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.BACKEND_SERVICE }}:${{ steps.meta.outputs.image_tag }}
          flags: >-
            --service-account=${{ env.BACKEND_SA_EMAIL }}
            --allow-unauthenticated
            --port=8080
            --min-instances=0
            --max-instances=5
            --memory=1Gi
            --update-labels=version=${{ steps.meta.outputs.gcp_label_version }}
            --set-env-vars=APP_NAME=GuíaVital,APP_VERSION=${{ steps.meta.outputs.app_version }},FRONTEND_URL=${{ env.CANONICAL_FRONTEND_URL }}
            --set-secrets=LLM_PROVIDER=LLM_PROVIDER:latest,LLM_MODEL=LLM_MODEL:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,LLM_FALLBACK_PROVIDER=LLM_FALLBACK_PROVIDER:latest,LLM_FALLBACK_MODEL=LLM_FALLBACK_MODEL:latest,GROQ_API_KEY=GROQ_API_KEY:latest,LLM_TIMEOUT_SECONDS=LLM_TIMEOUT_SECONDS:latest,LLM_TEMPERATURE=LLM_TEMPERATURE:latest,LLM_MAX_OUTPUT_TOKENS=LLM_MAX_OUTPUT_TOKENS:latest,MAX_INPUT_CHARS=MAX_INPUT_CHARS:latest,RATE_LIMIT_PER_MINUTE=RATE_LIMIT_PER_MINUTE:latest,HISTORIAL_DB=HISTORIAL_DB:latest,CORS_ORIGINS=CORS_ORIGINS:latest

      - name: Verificar endpoint de salud del Backend
        run: |
          curl --fail --silent --show-error "${{ steps.deploy_backend.outputs.url }}/manage/health"
          curl --fail --silent --show-error "${{ steps.deploy_backend.outputs.url }}/manage/info"

      - name: Ejecutar pruebas funcionales de humo contra Backend canónico (Smoke Tests)
        run: |
          python3 tests/smoke.py "${{ env.CANONICAL_BACKEND_URL }}"

  # =========================================================================
  # FASE 2: Despliegue del Frontend en Cloud Run (Consolidado Post-Tag)
  # =========================================================================
  deploy-frontend:
    name: Construcción y Despliegue del Frontend en Cloud Run
    # Espera a que el backend esté desplegado para obtener su URL dinámica
    needs: [deploy-backend]
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Descargar código fuente del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Búsqueda y consolidación de versión del Frontend
        id: meta
        run: |
          INPUT_TAG="${{ inputs.version_tag }}"
          if [ -n "$INPUT_TAG" ]; then
            RAW_TAG="$INPUT_TAG"
          elif git describe --tags --abbrev=0 >/dev/null 2>&1; then
            RAW_TAG="$(git describe --tags --abbrev=0)"
          else
            FRONT_VER="$(python3 -c "import json, pathlib; data = json.loads(pathlib.Path('frontend/package.json').read_text(encoding='utf-8')); print(data.get('version', '0.1.0'))")"
            RAW_TAG="v${FRONT_VER#v}"
          fi

          SEMVER_CLEAN="${RAW_TAG#v}"
          GCP_LABEL_VER="$(echo "${SEMVER_CLEAN}" | tr '[:upper:]' '[:lower:]' | tr '.' '-' | tr '+' '-')"
          IMAGE_TAG="v${SEMVER_CLEAN}"

          BRANCH="${GITHUB_REF_NAME:-main}"
          ENV_TAG="latest"
          if [ "$BRANCH" = "develop" ]; then
            ENV_TAG="develop"
          fi

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "env_tag=${ENV_TAG}" >> "$GITHUB_OUTPUT"
          echo "app_version=${SEMVER_CLEAN}" >> "$GITHUB_OUTPUT"
          echo "gcp_label_version=${GCP_LABEL_VER}" >> "$GITHUB_OUTPUT"

      - name: Autenticar en Google Cloud con cuenta de servicio
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_JSON_KEY }}

      - name: Configurar Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Resolver URL pública del Backend en Cloud Run
        id: backend_info
        run: |
          echo "backend_url=${{ env.CANONICAL_BACKEND_URL }}" >> "$GITHUB_OUTPUT"
          echo "Backend URL canónica para Frontend: ${{ env.CANONICAL_BACKEND_URL }}"

      - name: Configurar autenticación de Docker con Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      # Construcción consolidada: 1 sola imagen canónica + 1 puntero ambiental (sin atestaciones OCI)
      - name: Construir y publicar imagen consolidada del Frontend
        env:
          BUILDX_NO_DEFAULT_ATTESTATIONS: 1
          IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ steps.auth.outputs.project_id || env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.FRONTEND_SERVICE }}
        run: |
          docker build \
            --provenance=false \
            -f frontend/Dockerfile \
            --build-arg VITE_API_URL="${{ env.CANONICAL_BACKEND_URL }}" \
            --label "version=${{ steps.meta.outputs.app_version }}" \
            -t "${IMAGE_URI}:${{ steps.meta.outputs.image_tag }}" \
            -t "${IMAGE_URI}:${{ steps.meta.outputs.env_tag }}" \
            ./frontend
          docker push "${IMAGE_URI}:${{ steps.meta.outputs.image_tag }}"
          docker push "${IMAGE_URI}:${{ steps.meta.outputs.env_tag }}"

      - name: Desplegar servicio Frontend en Google Cloud Run
        id: deploy_frontend
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.FRONTEND_SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ steps.auth.outputs.project_id || env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.FRONTEND_SERVICE }}:${{ steps.meta.outputs.image_tag }}
          env_vars: |
            APP_VERSION=${{ steps.meta.outputs.app_version }}
            VITE_API_URL=${{ env.CANONICAL_BACKEND_URL }}
          flags: >-
            --allow-unauthenticated
            --port=8080
            --min-instances=0
            --max-instances=5
            --update-labels=version=${{ steps.meta.outputs.gcp_label_version }}

      - name: Verificar endpoint de salud del Frontend
        run: |
          curl --fail --silent --show-error "${{ steps.deploy_frontend.outputs.url }}/manage/health"
