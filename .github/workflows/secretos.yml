name: Auditoría y Detección de Secretos

on:
  workflow_call:
  workflow_dispatch:

jobs:
  gitleaks:
    name: Escaneo de secretos con Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código fuente del repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || '' }}
          fetch-depth: 0 # Analiza todo el historial de commits

      - name: Ejecutar análisis de fugas de secretos con Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.BUMP_TOKEN || secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          # gitleaks-action@v3 no soporta el evento 'workflow_run' de forma nativa;
          # al mapearlo a 'workflow_dispatch' ejecuta el escaneo completo del repositorio (--source=.)
          GITHUB_EVENT_NAME: ${{ github.event_name == 'workflow_run' && 'workflow_dispatch' || github.event_name }}
